<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Aviation</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0B0D17]">
    <div id="root"></div>
    <script type="text/babel">
        // Global helper for icons
        window.lucide = lucide;
    </script>
    <script type="text/babel" src="./cessna172s_checklist.js"></script>
    <script type="text/babel">
        window.addEventListener('load', () => {
            // Wait for Babel to finish translating the App
            setTimeout(() => {
                if (window.renderApp) { 
                    window.renderApp(); 
                } else {
                    console.error("App failed to mount. Check console for script errors.");
                }
            }, 500);
        });
    </script>
</body>
</html>
